<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ai.RnD business card – v3 proof</title>
<style>
  :root{--ever:#183c32;--paper:#f4f0e7;--terra:#c95f3f;--sun:#edbd55;--muted:#647069}
  *{box-sizing:border-box}
  body{margin:0;background:#11211c;color:var(--paper);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:1500px;margin:0 auto;padding:32px 20px 56px}
  h1{font-size:1.4rem;margin:0 0 4px;color:var(--sun);letter-spacing:.02em}
  p.sub{margin:0 0 24px;color:#b9c2bc;font-size:.95rem}
  .pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
  figure{margin:0}
  figure img{width:100%;height:auto;display:block;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  figcaption{font:500 .8rem/1.4 ui-monospace,Menlo,monospace;color:var(--sun);margin:10px 0 0;text-transform:uppercase;letter-spacing:.08em}
  h2{font-size:.95rem;color:var(--terra);margin:40px 0 12px;text-transform:uppercase;letter-spacing:.08em}
  .v1{display:flex;gap:16px;flex-wrap:wrap}
  .v1 figure{width:240px}
  .v1 img{border-radius:6px;opacity:.9}
  .note{margin-top:28px;font-size:.85rem;color:#9aa69f}
</style>
</head>
<body>
<main>
  <h1>Ai.RnD business card · v3</h1>
  <p class="sub">Vistaprint 3.5 × 2 in (shown trimmed). Layout matched one-for-one to the Sip Studies card. Proof only, not yet ordered.</p>
  <div class="pair">
    <figure><img src="v3-front.jpg" alt="Card front: warm cream card with a large blind-embossed Ai.RnD gear crest, the Ai RnD script wordmark, the line AI education and research, and the site address in script, all in evergreen"><figcaption>v3 · Front</figcaption></figure>
    <figure><img src="v3-back.jpg" alt="Card back: large full-color Ai.RnD crest, Jonathan Yu, Founder, a contact line, and a small evergreen QR code to the contact form in the bottom-right corner"><figcaption>v3 · Back</figcaption></figure>
  </div>
  <h2>Earlier versions</h2>
  <div class="v1">
    <figure><img src="v2-front.jpg" alt="Version 2 card front"><figcaption>v2 · Front</figcaption></figure>
    <figure><img src="v2-back.jpg" alt="Version 2 card back"><figcaption>v2 · Back</figcaption></figure>
    <figure><img src="v1-front.jpg" alt="Version 1 card front"><figcaption>v1 · Front</figcaption></figure>
    <figure><img src="v1-back.jpg" alt="Version 1 card back"><figcaption>v1 · Back</figcaption></figure>
  </div>
  <p class="note">The printed back carries the email and phone line; it is masked on this public preview page.</p>
</main>
</body>
</html>

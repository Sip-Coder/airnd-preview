<script type="application/json" id="atlas-copy">[{"id":"history","title":"History","lede":"I start here on purpose. Before settings menus and chat windows, people were already arguing about made minds. Follow the arc. It is the front door.","modules":[{"id":"myths","title":"Myths and made minds","lede":"Clay, bronze, and stories about bodies that move because someone gave them a job."},{"id":"calculation","title":"Logic, calculation, and early computing","lede":"True and false become switches, cards become instructions, and a machine learns to store its own recipe."},{"id":"dream","title":"The word and the dream","lede":"Clockwork that imitates a skill, a stage word for forced labor, and a science of feedback."},{"id":"turing-question","title":"Turing and the question","lede":"A universal machine, a plain-language test, and the limits of treating a demo as a coronation."},{"id":"naming","title":"Naming the field","lede":"A 1956 workshop gives the work a name, a hopeful summer, and a set of early programs with fences around them."},{"id":"symbolic","title":"Symbolic AI and expert systems","lede":"Rules, search, and bottled expertise. What worked inside a fence, and what broke when the world moved."},{"id":"seasons","title":"Winters and springs","lede":"Twice, the promises outran the programs. The useful pieces survived the funding anyway."},{"id":"from-data","title":"Learning from data","lede":"Show examples, adjust the system, and check the mistakes. Rules do not disappear. They stop being the only tool."},{"id":"connectionism","title":"Connectionism returns","lede":"Simple units, weighted links, and a training trick that arrived before the machines were ready."},{"id":"perception","title":"Perception breakthroughs","lede":"Vision and speech get good by tightening the task, then by learning the piece rules could not finish."},{"id":"sequences","title":"Sequences before transformers","lede":"Guess the next piece, remember a little longer, then learn to look back. Language models start here."},{"id":"transformers","title":"Transformers and large language models","lede":"Look at the relevant earlier pieces, train on a huge pile of text, then wrap the skill in a chat box."},{"id":"arguments","title":"Scale, products, and the arguments now","lede":"Preference tuning, shared exams, tool use, and the choice between a file you can download and a service you rent."}]},{"id":"what-ai-is","title":"What AI actually is","lede":"Plain words for the thing you have been nodding along to. No costume.","modules":[{"id":"plain","title":"The plain version","lede":"Prediction, a saved habit, a draft, and the pieces that habit is made of."},{"id":"under-the-hood","title":"Under the hood","lede":"Training writes the habit. Inference spends it. The window is only how much fits in one pass."},{"id":"hype","title":"Hype, translated","lede":"The words vendors use, turned back into jobs a beginner can recognize."},{"id":"siblings","title":"Sibling stories","lede":"Seeing, hearing, and moving, told as jobs with fences. The movie can wait outside."}]},{"id":"talking","title":"Talking to AI","lede":"How to brief the guess so the draft is about your work, not about its mood.","modules":[{"id":"first","title":"First conversations","lede":"Name the job, paste the situation, show a real example, and ask to see the steps."},{"id":"drafts","title":"A draft you can use","lede":"Point at the weak line, check what could hurt, cut the perfume, and keep the decision."},{"id":"budget","title":"The budget of a conversation","lede":"You spend pieces. The thread holds only so much. A tool call is a reach you choose."},{"id":"fence","title":"The fence","lede":"What never enters the box, which specifics you recheck, and when you stop the thread."}]},{"id":"building","title":"Building","lede":"What you might make once the words make sense: a page, a helper, a small product.","modules":[{"id":"shapes","title":"What you might make","lede":"A page, a repeated chore, a sketch of a product, or a checklist you already trust."},{"id":"shipping","title":"From idea to a click","lede":"How a sketch becomes a thing someone else can finish without you narrating."},{"id":"the-loop","title":"A loop you can trust","lede":"A few real cases, a pass or fail you can point at, and a log you actually read."},{"id":"with-tools","title":"Tools with a fence","lede":"Fetching is allowed. The fence is written first. A person can halt the run."}]},{"id":"work","title":"Work and judgment","lede":"Using this at a real job, and the calls you do not delegate.","modules":[{"id":"everyday","title":"At your work","lede":"Writing, replies, a human check, and research that does not invent its sources."},{"id":"judgment","title":"Judgment","lede":"What you do not paste, why fluent is not true, why your name still matters, and how text leaks."},{"id":"failure","title":"Failure modes, named","lede":"Fluent and ungrounded. People who try to talk it off the rails. Agreement that is not judgment."},{"id":"signature","title":"The signature","lede":"What stays yours, what you may hand off, and a weekly look so the split stays honest."}]}]</script>
